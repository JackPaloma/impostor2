name: impostor2
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Iconos estilo iOS
  cupertino_icons: ^1.0.8

  # Para guardar datos en el dispositivo
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Reglas de estilo de código
  flutter_lints: ^6.0.0

  # Herramienta para generar el icono de la app (Agregado)
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

# Configuración del Icono de la App (Agregado)
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"